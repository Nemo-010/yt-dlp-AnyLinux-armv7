name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 7 * * 1" # weekly: yt-dlp is a rolling target
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  # armv7 is not a GitHub runner, so everything is cross-built on x86_64 with
  # zig + the pinned Rust nightly. Nothing is emulated during the build itself.
  build:
    name: Build AppImage (armv7)
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparing container
        uses: pkgforge-dev/anylinux-setup-action@v6
      - name: Install dependencies
        run: /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
      - name: Smoke test
        run: ./tools/smoke-test.sh dist/yt-dlp-armv7.AppImage
      - name: Live network test
        env:
          YTDLP_NETWORK_TEST: 1
        run: ./tools/smoke-test.sh dist/yt-dlp-armv7.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppImage-armv7
          path: |
            dist/*.AppImage
            dist/*.AppImage.7z
            dist/version
            dist/appinfo

  release:
    if: >-
      github.ref_name == 'main' && github.event_name != 'pull_request'
      && needs.build.result == 'success'
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1.1

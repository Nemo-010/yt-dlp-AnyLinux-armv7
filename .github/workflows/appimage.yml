name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 7 * * 1" # weekly: yt-dlp tracks upstream releases
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch: {}

jobs:
  # armv7 is not a GitHub runner, so everything is cross-built on x86_64 with
  # zig and the pinned Rust nightly. Nothing is emulated during the build.
  build:
    name: Build AppImage (armv7)
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - name: Install dependencies
        run: /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
      - name: Smoke test
        env:
          YTDLP_NETWORK_TEST: 1
        run: ./tools/smoke-test.sh dist/yt-dlp-armv7.AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-armv7
          path: |
            dist/*.AppImage
            dist/version
            dist/appinfo

  release:
    if: >-
      github.ref_name == 'main' && github.event_name != 'pull_request'
      && needs.build.result == 'success'
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@4ed3d48ccb065352b6e6c0db6d39885b201c54a0 # v1.1
